<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notes</title>
<style>
  :root {
    --bg: #0e0d0a;
    --surface: #171510;
    --surface-2: #201d15;
    --border: #2c2820;
    --text: #f4f1e8;
    --muted: #a39a86;
    --accent: #eab308;
    --accent-soft: rgba(234, 179, 8, 0.14);
    --danger: #f87171;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .layout { display: grid; grid-template-columns: 280px 1fr; height: 100vh; height: 100dvh; }

  /* Sidebar */
  .sidebar {
    border-right: 1px solid var(--border); background: var(--surface);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head { padding: 16px 16px 12px; display: flex; align-items: center; justify-content: space-between; }
  .side-head h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font: inherit; font-size: 13px; font-weight: 600; padding: 7px 12px; border-radius: 9px;
    cursor: pointer; transition: border-color .15s, background .15s;
  }
  .btn:hover { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1608; }
  .btn.primary:hover { filter: brightness(1.08); }
  .btn.danger:hover { border-color: var(--danger); color: var(--danger); }
  .search { padding: 0 16px 12px; }
  .search input {
    width: 100%; background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    font: inherit; font-size: 13.5px; padding: 8px 12px; border-radius: 9px; outline: none;
  }
  .search input:focus { border-color: var(--accent); }
  .note-list { flex: 1; overflow-y: auto; padding: 0 8px 16px; }
  .note-item {
    padding: 11px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent;
    margin-bottom: 2px; transition: background .12s;
  }
  .note-item:hover { background: var(--surface-2); }
  .note-item.active { background: var(--accent-soft); border-color: rgba(234,179,8,0.35); }
  .note-item .t { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note-item .m { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; }
  .note-item .m .prev { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Editor */
  .editor { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .editor-head {
    display: flex; align-items: center; gap: 10px; padding: 14px 20px;
    border-bottom: 1px solid var(--border);
  }
  .editor-head input.title {
    flex: 1; min-width: 0; background: transparent; border: 0; outline: none;
    color: var(--text); font: inherit; font-size: 17px; font-weight: 700; letter-spacing: -0.01em;
  }
  .saved-hint { color: var(--muted); font-size: 12px; white-space: nowrap; transition: opacity .3s; }
  .editor-body { flex: 1; min-height: 0; }
  .editor-body textarea {
    width: 100%; height: 100%; resize: none; border: 0; outline: none; background: transparent;
    color: var(--text); font: inherit; font-size: 15px; line-height: 1.65; padding: 20px;
  }
  .editor-body textarea::placeholder { color: var(--muted); }
  .editor-foot {
    display: flex; align-items: center; gap: 16px; padding: 10px 20px;
    border-top: 1px solid var(--border); color: var(--muted); font-size: 12.5px;
  }

  /* Empty state */
  .empty { flex: 1; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 32px; text-align: center; }
  .empty.show { display: flex; }
  .empty .glyph { width: 56px; height: 56px; border-radius: 16px; background: var(--accent-soft); display: grid; place-items: center; }
  .empty h2 { font-size: 18px; }
  .empty p { color: var(--muted); font-size: 13.5px; max-width: 34ch; }
  .no-results { color: var(--muted); font-size: 13px; text-align: center; padding: 24px 12px; }

  .back-btn { display: none; }

  @media (max-width: 700px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { border-right: 0; }
    .editor { position: fixed; inset: 0; background: var(--bg); transform: translateX(100%); transition: transform .22s ease; z-index: 10; }
    .editor.open { transform: none; }
    .back-btn { display: inline-flex; }
  }
</style>
</head>
<body>
<section id="recovery" hidden style="position:fixed;inset:12px 12px auto;z-index:30;padding:16px;background:var(--surface);border:1px solid var(--danger);border-radius:12px;max-height:85vh;overflow:auto"><p id="recoveryMessage"></p><textarea id="draftData" readonly aria-label="Unsaved Notes data" style="width:100%;height:150px;margin:12px 0"></textarea><button class="btn" id="reloadData">Discard edits and reload</button></section>
<dialog id="deleteDialog" style="margin:auto;padding:24px;background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px"><p>Delete this note?</p><button class="btn danger" id="confirmDelete">Delete note</button> <button class="btn" id="cancelDelete">Cancel</button></dialog>
<div class="layout">
  <aside class="sidebar">
    <div class="side-head">
      <h1>Notes</h1>
      <button class="btn primary" id="newBtn">+ New</button>
    </div>
    <div class="search"><input type="search" id="searchInput" placeholder="Search notes…" aria-label="Search notes"></div>
    <div class="note-list" id="noteList"></div>
  </aside>

  <main class="editor" id="editorPane">
    <div class="editor-head">
      <button class="btn back-btn" id="backBtn" aria-label="Back to list">‹ Back</button>
      <input class="title" id="titleInput" placeholder="Note title" maxlength="120" aria-label="Note title">
      <span class="saved-hint" id="savedHint">Saved</span>
      <button class="btn danger" id="deleteBtn">Delete</button>
    </div>
    <div class="editor-body">
      <textarea id="bodyInput" placeholder="Start writing… your words never leave this device." aria-label="Note body"></textarea>
    </div>
    <div class="editor-foot">
      <span id="wordCount">0 words</span>
      <span id="charCount">0 characters</span>
      <span style="flex:1"></span>
      <span id="editedAt"></span>
    </div>
  </main>

  <main class="empty" id="emptyPane">
    <div class="glyph">
      <svg width="26" height="26" viewBox="0 0 96 96" fill="none" stroke="#eab308" stroke-width="7" stroke-linecap="round">
        <rect x="20" y="14" width="56" height="68" rx="8"/>
        <line x1="32" y1="32" x2="64" y2="32"/><line x1="32" y1="46" x2="64" y2="46"/><line x1="32" y1="60" x2="52" y2="60"/>
      </svg>
    </div>
    <h2>No note selected</h2>
    <p>Pick a note from the list, or create a new one. Your notes are stored on your Vela engine.</p>
    <button class="btn primary" id="emptyNewBtn">Create a note</button>
  </main>
</div>

<script src="_vela/sdk.js"></script>
<script>
(function () {
  "use strict";
  var STORE_KEY = "vela.notes.v1";

  var listEl = document.getElementById("noteList");
  var searchEl = document.getElementById("searchInput");
  var titleEl = document.getElementById("titleInput");
  var bodyEl = document.getElementById("bodyInput");
  var editorPane = document.getElementById("editorPane");
  var emptyPane = document.getElementById("emptyPane");
  var savedHint = document.getElementById("savedHint");
  var wordCountEl = document.getElementById("wordCount");
  var charCountEl = document.getElementById("charCount");
  var editedAtEl = document.getElementById("editedAt");

  var notes = [];
  var activeId = null;
  var saveTimer = null;

  function uid() {
    return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  var revision=0,loaded=false,dirty=false,busy=false,conflict=false,pending=Promise.resolve(),deleteId=null;
  function lock(value){['newBtn','emptyNewBtn','titleInput','bodyInput','deleteBtn'].forEach(function(id){document.getElementById(id).disabled=value;});}
  async function markDirty(value){dirty=value;await Vela.setUnsavedChanges(value);}
  async function load(){var saved=await Vela.storage.read();notes=saved.value?saved.value.notes:[];revision=saved.revision;loaded=true;conflict=false;lock(false);document.getElementById('recovery').hidden=true;if(notes.length)select(activeId&&notes.some(function(n){return n.id===activeId;})?activeId:notes[0].id);else showEmpty();savedHint.textContent='Saved to engine';}
  function persist(){
    clearTimeout(saveTimer);if(busy)return pending;if(conflict||!loaded)return Promise.reject(new Error('Resolve your unsaved edits first'));
    busy=true;lock(true);savedHint.textContent='Saving�';
    pending=(async function(){try{await markDirty(true);var saved=await Vela.storage.write({notes:notes},revision);revision=saved.revision;await markDirty(false);savedHint.textContent='Saved to engine';renderList();}
    catch(error){conflict=true;savedHint.textContent='Not saved';document.getElementById('recovery').hidden=false;document.getElementById('recoveryMessage').textContent=error.status===409?'Another client changed your notes. Your draft is retained here; copy it before reloading.':error.message;document.getElementById('draftData').value=JSON.stringify({notes:notes},null,2);throw error;}
    finally{busy=false;lock(conflict);}})();pending.catch(function(){});return pending;
  }
  Vela.onSave(persist);
  document.getElementById('reloadData').onclick=async function(){try{await load();await markDirty(false);}catch(error){document.getElementById('recoveryMessage').textContent=error.message;}};
  setInterval(async function(){if(!loaded||dirty||busy||conflict||document.hidden)return;try{var saved=await Vela.storage.read();if(dirty||busy||conflict)return;if(saved.revision!==revision){notes=saved.value?saved.value.notes:[];revision=saved.revision;if(activeId&&notes.some(function(n){return n.id===activeId;}))select(activeId);else if(notes.length)select(notes[0].id);else showEmpty();}}catch(error){savedHint.textContent='Disconnected';}},3000);
  function active() {
    return notes.find(function (n) { return n.id === activeId; }) || null;
  }
  function fmtTime(ts) {
    var d = new Date(ts);
    var today = new Date();
    var sameDay = d.toDateString() === today.toDateString();
    return sameDay
      ? d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })
      : d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
  }
  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderList() {
    var q = searchEl.value.trim().toLowerCase();
    var shown = notes.filter(function (n) {
      if (!q) return true;
      return (n.title + " " + n.body).toLowerCase().indexOf(q) !== -1;
    });
    shown.sort(function (a, b) { return b.updated - a.updated; });

    if (!shown.length) {
      listEl.innerHTML = '<div class="no-results">' + (q ? "No notes match your search." : "No notes yet. Create your first one.") + "</div>";
      return;
    }
    listEl.innerHTML = shown.map(function (n) {
      var preview = n.body.split("\n").filter(Boolean).join(" ").slice(0, 80) || "No content yet";
      return '<div class="note-item' + (n.id === activeId ? " active" : "") + '" data-id="' + n.id + '">' +
        '<div class="t">' + esc(n.title || "Untitled") + "</div>" +
        '<div class="m"><span>' + fmtTime(n.updated) + '</span><span class="prev">' + esc(preview) + "</span></div></div>";
    }).join("");

    listEl.querySelectorAll(".note-item").forEach(function (el) {
      el.addEventListener("click", function () { select(el.dataset.id); });
    });
  }

  function updateCounts() {
    var text = bodyEl.value;
    var words = text.trim() ? text.trim().split(/\s+/).length : 0;
    wordCountEl.textContent = words + (words === 1 ? " word" : " words");
    charCountEl.textContent = text.length + (text.length === 1 ? " character" : " characters");
    var n = active();
    editedAtEl.textContent = n ? "Edited " + fmtTime(n.updated) : "";
  }

  function select(id) {
    activeId = id;
    var n = active();
    if (!n) { showEmpty(); return; }
    emptyPane.classList.remove("show");
    editorPane.style.display = "flex";
    editorPane.classList.add("open");
    titleEl.value = n.title;
    bodyEl.value = n.body;
    updateCounts();
    renderList();
  }

  function showEmpty() {
    activeId = null;
    editorPane.style.display = "none";
    editorPane.classList.remove("open");
    emptyPane.classList.add("show");
    renderList();
  }

  function markSaving(){markDirty(true).catch(function(){});savedHint.textContent='Unsaved';clearTimeout(saveTimer);saveTimer=setTimeout(function(){persist().catch(function(){});},500);}
  function createNote() {
    if(!loaded||busy||conflict)return;
    var n = { id: uid(), title: "Untitled", body: "", updated: Date.now() };
    notes.unshift(n);
    persist();
    select(n.id);
    titleEl.focus();
    titleEl.select();
  }

  // Events
  document.getElementById("newBtn").addEventListener("click", createNote);
  document.getElementById("emptyNewBtn").addEventListener("click", createNote);
  document.getElementById("backBtn").addEventListener("click", function () {
    editorPane.classList.remove("open");
  });

  document.getElementById('deleteBtn').onclick=function(){if(!loaded||busy||conflict||!active())return;deleteId=activeId;document.getElementById('deleteDialog').showModal();};
  document.getElementById('cancelDelete').onclick=function(){document.getElementById('deleteDialog').close();};
  document.getElementById('confirmDelete').onclick=function(){document.getElementById('deleteDialog').close();if(busy||conflict)return;notes=notes.filter(function(n){return n.id!==deleteId;});persist();if(notes.length)select(notes[0].id);else showEmpty();};

  titleEl.addEventListener("input", function () {
    var n = active(); if (!n) return;
    n.title = titleEl.value;
    n.updated = Date.now();
    markSaving();
  });
  bodyEl.addEventListener("input", function () {
    var n = active(); if (!n) return;
    n.body = bodyEl.value;
    n.updated = Date.now();
    updateCounts();
    markSaving();
  });
  searchEl.addEventListener("input", renderList);

  // Init
  lock(true);showEmpty();
  Vela.ready.then(load).catch(function(error){savedHint.textContent=error.message;});
})();
</script>
</body>
</html>
