<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notes</title>
<link rel="stylesheet" href="vela-app.css">
<style>
  /* Notes keeps its own accent inside Vela's shared surfaces. */
  :root { --vela-accent: #7c4dee; --vela-accent-strong: #5f37c4; --vela-accent-soft: #ebe5ff; }
  /* The soft tint has to be redefined for dark as well as the strong one:
     keeping the light value there left the chosen note's title unreadable. */
  [data-vela-theme='dark'] {
    --vela-accent-strong: #cdbcff;
    --vela-accent-soft: color-mix(in srgb, #7c4dee 30%, transparent);
  }

  .note-title {
    flex: 1; min-width: 0; border: 0; outline: none; background: transparent;
    color: var(--vela-text); font: inherit; font-size: 17px; font-weight: 500;
    letter-spacing: -0.01em;
  }
  .note-status { color: var(--vela-faint); font-size: 12px; white-space: nowrap; }
  .note-body {
    flex: 1; width: 100%; min-height: 0; resize: none; border: 0; outline: none;
    background: transparent; color: var(--vela-text); font: inherit; font-size: 15px;
    line-height: 1.7; padding: 20px;
  }
  .note-body::placeholder { color: var(--vela-faint); }

  /* ---------- Notes inside Vela's app rail ----------

     The hub draws the rail, names the app and offers App settings, so this
     frame adds no second title bar. `vela-app.css` is the shared starter
     stylesheet; everything below is this app's own override of it, scoped to
     Notes' classes, and it responds to the frame's real width rather than the
     phone's. */

  .vela-layout { background: var(--vela-workspace); }

  /* The host header already says "Notes". Keep the heading for structure and
     for a screen reader, and give the space to Search and New note. */
  .note-list-heading {
    position: absolute;
    width: 1px; height: 1px;
    margin: -1px; padding: 0; border: 0;
    clip-path: inset(50%);
    overflow: hidden; white-space: nowrap;
  }

  /* A grid item keeps `min-width: auto` by default, so the list column was
     taking its width from the longest note title instead of from the space the
     server gave the frame, and rows ran off the right edge on a narrow phone.
     The shared starter stylesheet is left alone; this is Notes' own fix. */
  .vela-panel, .vela-panel-list, .vela-panel-head, .vela-panel-search { min-width: 0; }
  .vela-item-title, .vela-item-meta > span { min-width: 0; }
  .vela-field { min-width: 0; }

  .vela-panel { background: transparent; }
  .vela-panel-head { padding: 12px 12px 8px; }
  .vela-panel-head .vela-btn { flex: 1; justify-content: center; }
  .vela-panel-search { padding: 0 12px 10px; }

  /* A chosen note is marked by an edge bar as well as a surface, so selection
     never depends on colour alone. */
  .vela-item { position: relative; padding: 10px 11px 10px 13px; }
  .vela-item-active::before {
    content: ''; position: absolute; left: 3px; top: 10px; bottom: 10px;
    width: 3px; border-radius: 2px; background: var(--vela-accent);
  }
  .vela-item-active { color: var(--vela-text); }
  .vela-item-meta { margin-top: 3px; line-height: 1.5; }
  .vela-item-meta > .vela-item-preview { color: var(--vela-dim); }

  /* One continuous surface: the editor sits beside the list with a single
     divider, and its own head stays quiet. */
  .vela-surface { background: var(--vela-card); }
  .vela-surface-head {
    flex-wrap: wrap;
    row-gap: 6px;
    padding: 10px 16px;
    background: transparent;
  }
  .vela-surface-foot { padding: 8px 16px; }
  .note-body { padding: 20px 16px 24px; }

  /* A comfortable line length on a wide frame, starting under the title
     rather than floating in the middle of the pane. Narrow frames keep the
     full width. */
  @media (min-width: 760px) {
    .note-body { max-width: 78ch; }
  }

  /* A very narrow frame — a phone beside the rail — gives the title its own
     row instead of squeezing every control in the editor's head. */
  @media (max-width: 420px) {
    .vela-surface-head { padding: 8px 12px; }
    .note-title { order: 3; flex-basis: 100%; font-size: 16px; }
    .note-status { margin-left: auto; }
    .note-body { padding: 14px 12px 20px; }
    .vela-panel-head, .vela-panel-search { padding-inline: 10px; }
  }
  .note-recovery {
    position: fixed; inset: 12px 12px auto; z-index: 30; max-height: 85vh; overflow: auto;
    padding: 16px; border: 1px solid var(--vela-danger); border-radius: var(--vela-radius);
    background: var(--vela-card);
  }
  .note-recovery textarea {
    width: 100%; height: 150px; margin: 12px 0; padding: 10px;
    border: 1px solid var(--vela-border); border-radius: var(--vela-radius-sm);
    background: var(--vela-inset); color: var(--vela-text); font: inherit; font-size: 12px;
  }
</style>
</head>
<body>
<section class="note-recovery" id="recovery" hidden>
  <p id="recoveryMessage"></p>
  <textarea id="draftData" readonly aria-label="Unsaved Notes data"></textarea>
  <button class="vela-btn" id="reloadData">Discard edits and reload</button>
</section>

<dialog class="vela-dialog" id="deleteDialog" aria-labelledby="deleteTitle">
  <h2 id="deleteTitle" style="margin:0;font-size:17px;font-weight:500">Delete this note?</h2>
  <p style="margin:8px 0 0;color:var(--vela-dim);font-size:13.5px">This removes it from your Vela engine. It cannot be undone.</p>
  <div class="vela-dialog-actions">
    <button class="vela-btn" id="cancelDelete">Cancel</button>
    <button class="vela-btn vela-btn-danger" id="confirmDelete">Delete note</button>
  </div>
</dialog>

<div class="vela-layout">
  <aside class="vela-panel">
    <div class="vela-panel-head">
      <h1 class="vela-panel-title note-list-heading">Notes</h1>
      <button class="vela-btn vela-btn-small vela-btn-primary" id="newBtn">+ New note</button>
    </div>
    <div class="vela-panel-search">
      <input class="vela-field" type="search" id="searchInput" placeholder="Search notes…" aria-label="Search notes">
    </div>
    <div class="vela-panel-list" id="noteList" role="group" aria-label="Your notes"></div>
  </aside>

  <main class="vela-surface" id="editorPane">
    <div class="vela-surface-head">
      <button class="vela-btn vela-btn-small vela-back" id="backBtn" aria-label="Back to the note list">‹ Back</button>
      <input class="note-title" id="titleInput" placeholder="Note title" maxlength="120" aria-label="Note title">
      <span class="note-status" id="savedHint">Saved</span>
      <button class="vela-btn vela-btn-small vela-btn-danger" id="deleteBtn">Delete</button>
    </div>
    <div class="vela-surface-body">
      <textarea class="note-body" id="bodyInput" placeholder="Start writing… your words stay on this machine." aria-label="Note body"></textarea>
    </div>
    <div class="vela-surface-foot">
      <span id="wordCount">0 words</span>
      <span id="charCount">0 characters</span>
      <span style="flex:1"></span>
      <span id="editedAt"></span>
    </div>
  </main>

  <main class="vela-surface vela-empty" id="emptyPane" hidden>
    <span class="vela-empty-glyph" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 96 96" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round">
        <rect x="20" y="14" width="56" height="68" rx="8"/>
        <line x1="32" y1="32" x2="64" y2="32"/><line x1="32" y1="46" x2="64" y2="46"/><line x1="32" y1="60" x2="52" y2="60"/>
      </svg>
    </span>
    <h2>No note selected</h2>
    <p>Pick a note from the list, or create a new one. Your notes are stored on your Vela server.</p>
    <button class="vela-btn vela-btn-primary" id="emptyNewBtn">Create a note</button>
  </main>
</div>

<script src="_vela/sdk.js"></script>
<script src="vela-theme.js"></script>
<script src="vela-viewport.js"></script>
<script>
(function () {
  "use strict";

  var listEl = document.getElementById("noteList");
  var searchEl = document.getElementById("searchInput");
  var titleEl = document.getElementById("titleInput");
  var bodyEl = document.getElementById("bodyInput");
  var editorPane = document.getElementById("editorPane");
  var emptyPane = document.getElementById("emptyPane");
  var savedHint = document.getElementById("savedHint");
  var wordCountEl = document.getElementById("wordCount");
  var charCountEl = document.getElementById("charCount");
  var editedAtEl = document.getElementById("editedAt");

  var notes = [];
  var activeId = null;
  var saveTimer = null;

  function uid() {
    return "n" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  var revision=0,loaded=false,dirty=false,busy=false,conflict=false,pending=Promise.resolve(),deleteId=null;
  function lock(value){['newBtn','emptyNewBtn','titleInput','bodyInput','deleteBtn'].forEach(function(id){document.getElementById(id).disabled=value;});}
  async function markDirty(value){dirty=value;await Vela.setUnsavedChanges(value);}
  async function load(){var saved=await Vela.storage.read();notes=saved.value?saved.value.notes:[];revision=saved.revision;loaded=true;conflict=false;lock(false);document.getElementById('recovery').hidden=true;if(notes.length)select(activeId&&notes.some(function(n){return n.id===activeId;})?activeId:notes[0].id);else showEmpty();savedHint.textContent='Saved to your server';}
  function persist(){
    clearTimeout(saveTimer);if(busy)return pending;if(conflict||!loaded)return Promise.reject(new Error('Resolve your unsaved edits first'));
    busy=true;lock(true);savedHint.textContent='Saving…';
    pending=(async function(){try{await markDirty(true);var saved=await Vela.storage.write({notes:notes},revision);revision=saved.revision;await markDirty(false);savedHint.textContent='Saved to your server';renderList();}
    catch(error){conflict=true;savedHint.textContent='Not saved';document.getElementById('recovery').hidden=false;document.getElementById('recoveryMessage').textContent=error.status===409?'Another client changed your notes. Your draft is retained here; copy it before reloading.':error.message;document.getElementById('draftData').value=JSON.stringify({notes:notes},null,2);throw error;}
    finally{busy=false;lock(conflict);}})();pending.catch(function(){});return pending;
  }
  Vela.onSave(persist);
  document.getElementById('reloadData').onclick=async function(){try{await load();await markDirty(false);}catch(error){document.getElementById('recoveryMessage').textContent=error.message;}};
  setInterval(async function(){if(!loaded||dirty||busy||conflict||document.hidden)return;try{var saved=await Vela.storage.read();if(dirty||busy||conflict)return;if(saved.revision!==revision){notes=saved.value?saved.value.notes:[];revision=saved.revision;if(activeId&&notes.some(function(n){return n.id===activeId;}))select(activeId);else if(notes.length)select(notes[0].id);else showEmpty();}}catch(error){savedHint.textContent='Disconnected';}},3000);
  function active() {
    return notes.find(function (n) { return n.id === activeId; }) || null;
  }
  function fmtTime(ts) {
    var d = new Date(ts);
    var today = new Date();
    var sameDay = d.toDateString() === today.toDateString();
    return sameDay
      ? d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" })
      : d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }
  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderList() {
    var q = searchEl.value.trim().toLowerCase();
    var shown = notes.filter(function (n) {
      if (!q) return true;
      return (n.title + " " + n.body).toLowerCase().indexOf(q) !== -1;
    });
    shown.sort(function (a, b) { return b.updated - a.updated; });

    if (!shown.length) {
      listEl.innerHTML = '<p class="vela-note">' + (q ? "No notes match your search." : "No notes yet. Create your first one.") + "</p>";
      return;
    }
    listEl.innerHTML = shown.map(function (n) {
      var preview = n.body.split("\n").filter(Boolean).join(" ").slice(0, 80) || "No content yet";
      return '<button type="button" class="vela-item' + (n.id === activeId ? " vela-item-active" : "") + '"' +
        (n.id === activeId ? ' aria-current="true"' : "") + ' data-id="' + n.id + '">' +
        '<span class="vela-item-title">' + esc(n.title || "Untitled") + "</span>" +
        '<span class="vela-item-meta"><span>' + fmtTime(n.updated) + '</span><span class="vela-item-preview">' + esc(preview) + "</span></span></button>";
    }).join("");

    listEl.querySelectorAll(".vela-item").forEach(function (el) {
      el.addEventListener("click", function () { select(el.dataset.id, true); });
    });
  }

  function updateCounts() {
    var text = bodyEl.value;
    var words = text.trim() ? text.trim().split(/\s+/).length : 0;
    wordCountEl.textContent = words + (words === 1 ? " word" : " words");
    charCountEl.textContent = text.length + (text.length === 1 ? " character" : " characters");
    var n = active();
    editedAtEl.textContent = n ? "Edited " + fmtTime(n.updated) : "";
  }

  // `reveal` is true only when someone chose a note. Restoring a selection on
  // load must not slide the editor over the list on a phone.
  function select(id, reveal) {
    activeId = id;
    var n = active();
    if (!n) { showEmpty(); return; }
    emptyPane.hidden = true;
    editorPane.hidden = false;
    if (reveal) editorPane.classList.add("vela-surface-open");
    titleEl.value = n.title;
    bodyEl.value = n.body;
    updateCounts();
    renderList();
  }

  function showEmpty() {
    activeId = null;
    editorPane.hidden = true;
    editorPane.classList.remove("vela-surface-open");
    emptyPane.hidden = false;
    renderList();
  }

  function markSaving(){markDirty(true).catch(function(){});savedHint.textContent='Unsaved';clearTimeout(saveTimer);saveTimer=setTimeout(function(){persist().catch(function(){});},500);}
  function createNote() {
    if(!loaded||busy||conflict)return;
    var n = { id: uid(), title: "Untitled", body: "", updated: Date.now() };
    notes.unshift(n);
    persist();
    select(n.id, true);
    titleEl.focus();
    titleEl.select();
  }

  // Events
  document.getElementById("newBtn").addEventListener("click", createNote);
  document.getElementById("emptyNewBtn").addEventListener("click", createNote);
  document.getElementById("backBtn").addEventListener("click", function () {
    editorPane.classList.remove("vela-surface-open");
    searchEl.focus();
  });

  document.getElementById('deleteBtn').onclick=function(){if(!loaded||busy||conflict||!active())return;deleteId=activeId;document.getElementById('deleteDialog').showModal();};
  document.getElementById('cancelDelete').onclick=function(){document.getElementById('deleteDialog').close();};
  document.getElementById('confirmDelete').onclick=function(){document.getElementById('deleteDialog').close();if(busy||conflict)return;notes=notes.filter(function(n){return n.id!==deleteId;});persist();if(notes.length)select(notes[0].id);else showEmpty();};

  titleEl.addEventListener("input", function () {
    var n = active(); if (!n) return;
    n.title = titleEl.value;
    n.updated = Date.now();
    markSaving();
  });
  bodyEl.addEventListener("input", function () {
    var n = active(); if (!n) return;
    n.body = bodyEl.value;
    n.updated = Date.now();
    updateCounts();
    markSaving();
  });
  searchEl.addEventListener("input", renderList);

  // Init
  lock(true);showEmpty();
  Vela.ready.then(load).catch(function(error){savedHint.textContent=error.message;});
})();
</script>
</body>
</html>
